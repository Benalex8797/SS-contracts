name: PR Target Check
on:
  pull_request_target:
    branches:
      - main
jobs:
  warn-wrong-target:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment and close PR targeting main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `👋 Hey @${context.payload.pull_request.user.login}! Thanks for your contribution.

It looks like this PR targets the \`main\` branch. We only accept PRs targeting the \`dev\` branch — please reopen your PR against \`dev\` instead.

Steps to fix:
1. Close this PR
2. Change the base branch to \`dev\`
3. Reopen the PR

Thanks! 🚀`
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });


name: PR Check

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR Title & Description
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PR title (conventional commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Check PR description for issue reference
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json body --jq '.body')
          if ! echo "$PR_BODY" | grep -qiE '(Closes|Fixes|Resolves)\s+#\d+'; then
            echo "::error::PR description must contain a closing keyword (Closes #XX, Fixes #XX, or Resolves #XX)"
            exit 1
          fi
          echo "✓ Issue reference found in PR description"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}